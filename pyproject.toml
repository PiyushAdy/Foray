[project]
name = "foray"
version = "0.1.0"
description = "The local intelligence layer for your codebase. Index locally, chat with grounded citations, serve context to agents over MCP."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Foray" }]
keywords = ["code-search", "mcp", "tree-sitter", "rag", "local-first"]

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-language-pack>=1.4",
    "networkx>=3.3",
    "pathspec>=0.12",
    "chromadb>=0.5",
    "fastembed>=0.3",
    "litellm>=1.40",
    "fastmcp>=2.0",
]

[project.scripts]
foray = "foray.cli:main"
foray-mcp = "foray.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foray"]

[tool.hatch.build.targets.sdist]
include = ["foray", "tests", "demo_repos.yaml", "README.md"]
exclude = ["frontend/node_modules", "frontend/dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
filterwarnings = ["ignore::DeprecationWarning"]
